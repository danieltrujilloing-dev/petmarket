services:
  # PostgreSQL - Base de datos principal
  postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    container_name: petmarket-postgres
    environment:
      POSTGRES_DB: petmarket
      POSTGRES_USER: petmarket_user
      POSTGRES_PASSWORD: petmarket_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - petmarket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petmarket_user -d petmarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache con TTL
  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: petmarket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - petmarket-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper - Requerido para Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: petmarket-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - petmarket-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka - Para eventos
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: petmarket-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    networks:
      - petmarket-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka UI - Para monitorear Kafka (opcional)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: petmarket-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - petmarket-network

  # Adminer - Para administrar PostgreSQL (opcional)
  adminer:
    image: adminer:4.8.1
    container_name: petmarket-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - petmarket-network
    depends_on:
      postgres:
        condition: service_healthy

  # Redis Commander - Para administrar Redis (opcional)
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    platform: linux/arm64
    container_name: petmarket-redis-commander
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - petmarket-network
    depends_on:
      redis:
        condition: service_healthy

# Volúmenes persistentes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# Red personalizada
networks:
  petmarket-network:
    driver: bridge
