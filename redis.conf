# Configuración de Redis para PetMarket

# Configuración básica
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# Configuración de memoria y TTL
maxmemory 256mb
maxmemory-policy allkeys-lru

# Configuración de persistencia (opcional para desarrollo)
save 900 1
save 300 10
save 60 10000

# Configuración de logging
loglevel notice
logfile ""

# Configuración de seguridad básica
protected-mode no

# Configuración adicional
databases 16
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
