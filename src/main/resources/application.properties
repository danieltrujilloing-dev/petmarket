spring.application.name=petmarket

# =============================================================================
# CONFIGURACIÓN DE BASE DE DATOS POSTGRESQL
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/petmarket
spring.datasource.username=petmarket_user
spring.datasource.password=petmarket_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =============================================================================
# CONFIGURACIÓN DE FLYWAY
# =============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-suffix=.sql
spring.flyway.sql-migration-separator=__
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# =============================================================================
# CONFIGURACIÓN DE REDIS (CACHE)
# =============================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0

# Configuración de Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=86400000
spring.cache.redis.cache-null-values=false

# =============================================================================
# CONFIGURACIÓN DE KAFKA
# =============================================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Configuración del consumidor (si lo necesitas después)
spring.kafka.consumer.group-id=petmarket-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# =============================================================================
# CONFIGURACIÓN DE ACTUATOR
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# =============================================================================
# CONFIGURACIÓN DE LOGGING
# =============================================================================
logging.level.com.interview.petmarket=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =============================================================================
# CONFIGURACIÓN DE PETMARKET ESPECÍFICA
# =============================================================================
# Cache TTL para productos (15 minutos por defecto)
petmarket.cache.productos.ttl=PT15M
# TTL específico para filtros complejos (30 minutos)
petmarket.cache.productos.filtros.ttl=PT30M
# TTL para productos individuales (1 hora)
petmarket.cache.productos.individual.ttl=PT1H
# Configuración de prefijos de cache
petmarket.cache.productos.prefix=petmarket:productos:
petmarket.cache.productos.individual.prefix=petmarket:producto:

# =============================================================================
# CONFIGURACIÓN DE DESARROLLO
# =============================================================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
