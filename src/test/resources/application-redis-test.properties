# =============================================================================
# CONFIGURACIÓN DE TESTS CON REDIS - PetMarket
# =============================================================================

# Base de datos PostgreSQL para tests (misma configuración que tests normales)
spring.datasource.url=jdbc:postgresql://localhost:5432/petmarket_test
spring.datasource.username=petmarket_user
spring.datasource.password=petmarket_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate para tests
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.format-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =============================================================================
# FLYWAY PARA TESTS
# =============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-suffix=.sql
spring.flyway.sql-migration-separator=__
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

# =============================================================================
# REDIS HABILITADO PARA TESTS DE REDIS
# =============================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms
spring.data.redis.database=1
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0

# Configuración de Cache habilitada para tests
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# =============================================================================
# KAFKA DESHABILITADO PARA TESTS DE REDIS
# =============================================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# =============================================================================
# LOGGING PARA TESTS
# =============================================================================
logging.level.com.interview.petmarket=DEBUG
logging.level.org.springframework.data.redis=DEBUG
logging.level.redis.clients.jedis=DEBUG
