# =============================================================================
# TESTS DE INTEGRACIÓN - REDIS + POSTGRESQL
# =============================================================================

# PostgreSQL para tests de integración
spring.datasource.url=jdbc:postgresql://localhost:5432/petmarket_test
spring.datasource.username=petmarket_user
spring.datasource.password=petmarket_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Schema automático para tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Redis para cache de tests
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=1
spring.cache.type=redis

# TTL del cache para tests (más corto)
petmarket.cache.productos.ttl=PT1M

# Configuración mínima para tests
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.interview.petmarket=DEBUG