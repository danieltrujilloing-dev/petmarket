# =============================================================================
# TESTS UNITARIOS - SOLO DOMINIO (SIN REDIS/KAFKA)
# =============================================================================

# PostgreSQL para tests unitarios
spring.datasource.url=jdbc:postgresql://localhost:5432/petmarket_test
spring.datasource.username=petmarket_user
spring.datasource.password=petmarket_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Schema automático para tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Deshabilitar servicios externos para tests unitarios
spring.cache.type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Configuración mínima para tests
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.interview.petmarket=WARN