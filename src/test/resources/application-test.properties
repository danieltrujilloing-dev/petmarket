# =============================================================================
# CONFIGURACIÓN DE TESTS - POSTGRESQL
# =============================================================================

# Base de datos PostgreSQL para tests (base de datos separada)
spring.datasource.url=jdbc:postgresql://localhost:5432/petmarket_test
spring.datasource.username=petmarket_user
spring.datasource.password=petmarket_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate para tests
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =============================================================================
# FLYWAY PARA TESTS
# =============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-suffix=.sql
spring.flyway.sql-migration-separator=__
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

# =============================================================================
# REDIS DESHABILITADO PARA TESTS UNITARIOS
# =============================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.cache.type=none

# =============================================================================
# KAFKA DESHABILITADO PARA TESTS UNITARIOS
# =============================================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=petmarket-test
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# =============================================================================
# ACTUATOR SIMPLIFICADO PARA TESTS
# =============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# =============================================================================
# LOGGING PARA TESTS
# =============================================================================
logging.level.com.interview.petmarket=DEBUG
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
